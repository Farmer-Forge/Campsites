<div class="auth-page">
  <form class="auth-card" (ngSubmit)="submit()">
    <div class="auth-header"><h1>Reset Password</h1></div>
    <div class="auth-body">
      <p class="auth-help">Enter your account email and we'll send you a link to choose a new password.</p>
      <input
        class="rt-input"
        type="email"
        name="email"
        placeholder="Email"
        autocomplete="email"
        [(ngModel)]="email"
      />
      @if (sent()) {
        <p class="rt-notice">
          If an account exists for that email, we've sent a reset link. Check your inbox (and spam folder).
        </p>
      }
      @if (error()) {
        <p class="rt-error">{{ error() }}</p>
      }
      <button class="rt-btn rt-btn--cherry auth-submit" type="submit" [disabled]="submitting() || !email">
        Send reset link
      </button>
      <a class="auth-switch" routerLink="/login">Back to sign in</a>
    </div>
  </form>
</div>
